name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore GymManagement.slnx

      - name: Build (Release)
        run: dotnet build GymManagement.slnx --configuration Release --no-restore

      - name: Test (Release)
        run: dotnet test GymManagement.slnx --configuration Release --no-build --logger "console;verbosity=normal"
